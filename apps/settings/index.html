<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Istanbul3D Settings</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      :root {
        font-family: 'JetBrains Mono', 'Courier New', monospace;
        --color-text: #FFFFFF;
        --color-text-muted: #A0A0A0;
        --color-accent: #007AFF;
        --color-menu-bg: #212121;
        --color-canvas-bg: #282828;
        --color-input-bg: #333333;
        --color-border: rgba(255, 255, 255, 0.15);
        --sidebar-width: 200px;
      }

      html, body { height: 100%; background: var(--color-canvas-bg); color: var(--color-text); }
      body { display: flex; }

      .sidebar-title {
        padding: 0 24px 20px;
        font-size: 13px;
        font-weight: 700;
        color: var(--color-text);
        letter-spacing: 0.05em;
      }

      .sidebar {
        width: var(--sidebar-width);
        background: var(--color-menu-bg);
        position: fixed;
        top: 0; left: 0; bottom: 0;
        display: flex;
        flex-direction: column;
        padding: 24px 0;
      }

      .sidebar-nav {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 2px;
        padding: 0 12px;
      }

      .sidebar-nav a {
        display: block;
        padding: 8px 12px;
        border-radius: 4px;
        text-decoration: none;
        color: var(--color-text-muted);
        font-size: 13px;
        font-weight: 500;
        border-left: 2px solid transparent;
        transition: color 0.15s;
      }

      .sidebar-nav a:hover { color: var(--color-text); }

      .sidebar-nav a.active {
        color: var(--color-text);
        border-left-color: var(--color-accent);
      }

      .sidebar-footer { padding: 0 12px; }

      .sidebar-footer a {
        display: block;
        padding: 8px 12px;
        text-decoration: none;
        color: var(--color-text-muted);
        font-size: 13px;
        transition: color 0.15s;
      }

      .sidebar-footer a:hover { color: var(--color-text); }
      .sidebar-footer a.active { color: var(--color-text); }

      .canvas-area {
        margin-left: var(--sidebar-width);
        flex: 1;
        padding: 32px;
        overflow-y: auto;
        min-height: 100vh;
      }

      .typography-h1 { font-size: 20px; font-weight: 700; color: var(--color-text); margin-bottom: 12px; }
      .typography-body-muted { font-size: 11px; color: var(--color-text-muted); line-height: 1.7; margin-bottom: 24px; }

      .section {
        border-top: 1px solid var(--color-border);
        margin-top: 20px;
        padding-top: 16px;
      }

      .section-label {
        font-size: 11px;
        font-weight: 700;
        color: var(--color-text-muted);
        text-transform: uppercase;
        letter-spacing: 0.08em;
        margin-bottom: 12px;
      }

      .row { display: flex; gap: 8px; margin-bottom: 12px; align-items: center; flex-wrap: wrap; }

      input {
        padding: 7px 10px;
        background: var(--color-input-bg);
        border: 1px solid var(--color-border);
        border-radius: 4px;
        color: var(--color-text);
        font-family: inherit;
        font-size: 12px;
        outline: none;
      }

      input:focus { border-color: var(--color-accent); }

      button {
        padding: 7px 14px;
        background: transparent;
        border: 1px solid var(--color-border);
        border-radius: 4px;
        color: var(--color-text);
        font-family: inherit;
        font-size: 12px;
        cursor: pointer;
        transition: color 150ms ease, background-color 150ms ease, border-color 150ms ease, filter 150ms ease, transform 120ms ease;
      }

      @media (hover: hover) {
        button:not(:disabled):hover { filter: brightness(1.08); }
      }

      button:not(:disabled):active { transform: translateY(1px) scale(0.98); }

      button.primary {
        background: var(--color-accent);
        border-color: var(--color-accent);
        color: #fff;
      }

      button:disabled { opacity: 0.4; cursor: not-allowed; }

      .key-status {
        font-size: 11px;
        margin-bottom: 12px;
      }

      .key-status--set { color: #22C55E; }
      .key-status--unset { color: var(--color-text-muted); }

      .save-feedback {
        font-size: 11px;
        color: #22C55E;
        min-height: 16px;
        margin-top: 8px;
      }
    </style>
  </head>
  <body>
    <nav class="sidebar">
      <div class="sidebar-title">Istanbul3D</div>
      <div class="sidebar-nav">
        <a href="/viewer">Viewer</a>
        <a href="/repair">Repair</a>
      </div>
      <div class="sidebar-footer">
        <a href="/settings" class="active" style="display:flex;align-items:center;gap:6px;">
          <i class="ph ph-gear" aria-hidden="true"></i>
          Settings
        </a>
      </div>
    </nav>

    <main class="canvas-area">
      <h1 class="typography-h1">Settings</h1>
      <p class="typography-body-muted">
        Configuration is saved to <code>settings.json</code> at the repo root and persists across server restarts.
        No restart is needed after saving.
      </p>

      <div class="section">
        <div class="section-label">FAL Key</div>
        <p id="keyStatus" class="key-status key-status--unset">No key set</p>
        <div class="row">
          <input id="falKeyInput" type="password" placeholder="fal_key_…" style="width:320px;" autocomplete="off" />
          <button id="saveBtn" class="primary">Save</button>
        </div>
        <p id="saveFeedback" class="save-feedback"></p>
      </div>
    </main>

    <script>
      const keyStatus = document.getElementById('keyStatus');
      const falKeyInput = document.getElementById('falKeyInput');
      const saveBtn = document.getElementById('saveBtn');
      const saveFeedback = document.getElementById('saveFeedback');

      async function loadStatus() {
        try {
          const res = await fetch('/api/settings');
          const data = await res.json();
          if (data.fal_key_set) {
            keyStatus.textContent = 'Key saved \u2713';
            keyStatus.className = 'key-status key-status--set';
          } else {
            keyStatus.textContent = 'No key set';
            keyStatus.className = 'key-status key-status--unset';
          }
        } catch {
          keyStatus.textContent = 'Could not load settings';
          keyStatus.className = 'key-status key-status--unset';
        }
      }

      saveBtn.addEventListener('click', async () => {
        const key = falKeyInput.value.trim();
        if (!key) return;
        saveBtn.disabled = true;
        saveFeedback.textContent = '';
        try {
          const res = await fetch('/api/settings', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ fal_key: key })
          });
          if (res.ok) {
            falKeyInput.value = '';
            saveFeedback.textContent = 'Saved.';
            await loadStatus();
          } else {
            saveFeedback.textContent = 'Save failed.';
          }
        } catch {
          saveFeedback.textContent = 'Save failed.';
        } finally {
          saveBtn.disabled = false;
        }
      });

      loadStatus();
    </script>
  </body>
</html>
